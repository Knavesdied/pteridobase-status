# NOTIFICATIONS — deliberately NOT configured here, because they cannot be.
#
# Upptime reads every notification setting from GITHUB ACTIONS SECRETS, not from
# this file: uptime.yml passes them through as a SECRETS_CONTEXT blob. There is
# no `notifications:` key in this config, and writing one has no effect — it
# would sit here looking configured while nothing sends. Verified by reading
# .github/workflows/uptime.yml rather than from the documentation.
#
# The credential is the owner's to create and never Claude's to handle. The
# intended channel is SMTP via Resend, already a Pteridobase sub-processor for
# transactional mail, so it adds no new company to the privacy posture.
#
# Set these as repository secrets (Settings -> Secrets and variables -> Actions):
#
#   NOTIFICATION_EMAIL             true
#   NOTIFICATION_EMAIL_STRATEGY    smtp
#   NOTIFICATION_EMAIL_SMTP_HOST   smtp.resend.com
#   NOTIFICATION_EMAIL_SMTP_PORT   587
#   NOTIFICATION_EMAIL_SMTP_USERNAME  resend
#   NOTIFICATION_EMAIL_SMTP_PASSWORD  <the Resend API key>
#   NOTIFICATION_EMAIL_FROM        Pteridobase Status <status@pteridobase.org>
#   NOTIFICATION_EMAIL_TO          <where the alert should land>
