# Pteridobase status monitoring — Upptime configuration.
#
# WHY THIS EXISTS. On 1 September 2026 production served pages in 4–47 seconds
# for roughly five hours and nothing alerted — the owner noticed. Real
# contributors were using the site throughout. See Knavesdied/Pteridobase#862
# for the incident record and #864 for this work.
#
# WHY IT RUNS ON GITHUB rather than on our own infrastructure: an alert must
# not share fate with the thing it watches. beta.pteridobase.org and
# pteridobase.org sit on ONE physical IONOS host — verified, they report the
# same CPU model, core count and load average — so anything hosted there would
# have been degraded alongside the site it was meant to be reporting on.
#
# Everything here is config-as-code in a public repo: the checks, the uptime
# history and the incident record are all auditable, rather than living in a
# vendor's dashboard.

owner: Knavesdied
repo: pteridobase-status

sites:
  - name: Pteridobase
    url: https://pteridobase.org/
    # DEGRADED above this threshold, not merely DOWN — and that distinction is
    # the whole point. The 1 September incident returned HTTP 200 throughout:
    # the site was slow, not broken, so a plain up/down check would have missed
    # it completely.
    #
    # Set from the MEASURED baseline in Pteridobase's
    # scripts/perf/history/prod.jsonl (26 samples spanning the incident and the
    # recovery), not from a guess:
    #
    #   healthy full page      ~0.24 s
    #   known transient spike  ~0.73 s   the conservation stats cache
    #                                    rebuilding on its 10-minute TTL —
    #                                    expected, see Pteridobase#614
    #   during the incident    4 – 47 s
    #
    # 2000 ms sits comfortably above the known-benign spike and an order of
    # magnitude below the fault, so it should neither miss a real incident nor
    # cry wolf. A check people learn to ignore is worse than no check at all.
    maxResponseTime: 2000

  - name: Exotic Fern Group
    url: https://www.exoticferngroup.org/
    # The parent charity's own site. Not ours to fix, which is exactly why the
    # threshold is looser than Pteridobase's: an alert we cannot act on is noise,
    # and the useful question here is "is it down or badly broken?", not "is it
    # 200ms slower than yesterday?".
    #
    # Measured before choosing, five samples on 1 September 2026: 0.37-0.40s warm,
    # 1.13s on a cold connection (TTFB 0.09-0.67s). 3000ms clears the cold case
    # with room to spare.
    #
    # The `www` host is monitored deliberately: the apex 301s to it, and following
    # a redirect on every check would measure two hops and report the wrong one as
    # slow.
    maxResponseTime: 3000

  # TO ADD once Pteridobase#864's health endpoint reaches PRODUCTION. It is built
  # and verified on beta (both poles: 200 {"ok":true,...}, and 503 {"ok":false}
  # when the database is unreachable) but /api/v1/health still 404s on production
  # until the release is promoted. Adding it before then would monitor a URL that
  # does not exist and report a permanent outage.
  #
  #   - name: Pteridobase API
  #     url: https://pteridobase.org/api/v1/health
  #     maxResponseTime: 1000
  #     # Verifies CONTENT, not just the status code. A 200 carrying {"ok":false}
  #     # would otherwise read as healthy — and the whole reason this endpoint
  #     # exists is that a 200 from a PAGE proves nothing about the database.
  #     __dangerous__body_degraded_if_text_missing: '"ok":true'
  #
  # Deliberately NOT monitoring beta: it sits behind HTTP Basic auth and would
  # answer 401 to every check.

status-website:
  cname: status.pteridobase.org
  name: Pteridobase Status
  theme: light

  # The page's own introduction. Restored after being dropped when this block was
  # rewritten for the branding - the <header> in <main> rendered empty and the
  # page opened straight into the status cards.
  #
  # TITLE ONLY, no introMessage. The descriptive paragraph was removed at the
  # owner's request: the page's job is to show whether things are up, and a
  # visitor who has navigated to a status page does not need it explained.
  introTitle: "**Pteridobase** platform status"


  # BRANDING. Upptime's status page is a static Svelte site we control through
  # these keys, so matching pteridobase.org is configuration rather than a fork.
  #
  # EVERY ASSET IS SERVED BY THIS SITE ITSELF. Not one byte the page LOADS comes
  # from pteridobase.org - a status page that pulls its fonts, logo or icon from
  # the site it reports on loses them during exactly the outage it exists to
  # explain. The pteridobase.org URLs below are all LINKS, which is a different
  # thing: a link that is slow to answer during an incident is expected, and
  # costs the reader nothing until they click it.
  #
  # HOW LOCAL HOSTING WORKS, since it is not obvious and the paths look wrong:
  # @upptime/status-page's post-process.ts copies the repo's `assets/` directory
  # into the site export ROOT, recursively. So `assets/fonts/x.woff2` is served
  # at `/fonts/x.woff2` and `assets/site-icon-32x32.png` at `/site-icon-32x32.png`
  # - the `assets/` segment does NOT appear in the URL. (`/assets/logo.svg` 404s;
  # `/logo.svg` is the file.) Same-origin, so no CORS question arises either.
  #
  # An earlier draft referenced these through raw.githubusercontent.com. That was
  # independent of pteridobase.org and would have worked, but it is still a
  # second host that can fail on its own - and there is no reason to accept that
  # when the page can serve them itself.

  # THE TAB ICON IS OVERWRITTEN, NOT CONFIGURED. Upptime emits its own
  # <link rel=icon href=/logo-192.png> AFTER ours, so the last one wins and our
  # data: URI lost. `logoUrl` was tried and did NOT regenerate that file - it
  # came back byte-identical. So assets/logo-192.png and assets/logo-512.png
  # simply OVERWRITE the generated ones: post-process copies assets/ over the
  # export AFTER Sapper runs, which is the same mechanism already serving the
  # fonts. Whatever link the template emits, the bytes behind it are ours.
  #
  # The icon is a data: URI, NOT a path. Sapper's exporter crawls HTML links
  # and generates a 404 route for anything it cannot resolve - which creates a
  # DIRECTORY named `site-icon-32x32.png`, and post-process then fails with
  # EISDIR trying to copy the real file onto it. A data: URI sidesteps the
  # crawler entirely and is as local as it is possible to be. It is 1.2 kB, so
  # the cost is trivial; the 180/192 home-screen icons are deliberately left
  # out rather than inlined at 25-38 kB each for a page nobody installs.
  customHeadHtml: |
    <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64," />
    <meta name="theme-color" content="#33340e" />

  # THE HEADER AND THE FOOTER ARE BOTH HERE, and the footer's placement is the
  # reason. `customFootHtml` exists in @upptime/status-page's current source but
  # is NOT emitted by the version uptime-monitor v1.43.16 pins - verified by
  # grepping the served HTML, where the only `pb-footer` string was the one in
  # our own CSS. A key that silently does nothing is worse than no key, so it is
  # removed rather than left looking configured.
  #
  # Both blocks are therefore injected at the TOP of #sapper, and CSS `order`
  # puts the footer last (see the flex rules below). Ordering in CSS rather than
  # in the DOM also means this keeps working if the injection point moves.
  #
  # The site header. Deliberately WITHOUT the hamburger toggle that
  # site-header.php carries: that exists because the real nav has five or more
  # links, and with two they fit at every width. A non-functioning toggle would
  # be worse than none, since this page ships no JS of its own.
  customBodyHtml: |
    <header class="pb-navbar" role="banner">
      <a class="pb-logo-wrap" href="https://pteridobase.org/" rel="home">
        <span class="pb-logo-img" role="img" aria-label="Exotic Fern Group logo"></span>
        <span class="pb-logo-textblock">
          <span class="pb-logo-text">Pteridobase: An EFG Resource</span>
          <span class="pb-logo-sub">The conservation and data platform of the Exotic Fern Group</span>
        </span>
      </a>
      <nav class="pb-nav-links" aria-label="Primary navigation">
        <a href="https://pteridobase.org/">Pteridobase</a>
        <a href="https://www.exoticferngroup.org/">Exotic Fern Group</a>
      </nav>
    </header>

    <footer class="pb-footer" role="contentinfo">
      <div class="pb-footer__inner">
        <div class="pb-footer__brand">
          <a class="pb-footer__brand-link" href="https://pteridobase.org/" rel="home"><strong>Pteridobase</strong>: An EFG Resource</a>
          <p class="pb-footer__legalrow">
            <span>&#169; Exotic Fern Group</span>
            <span>A charitable incorporated organisation registered in England &amp; Wales</span>
            <span>Charity no.&#160;1219251</span>
            <span>Status monitoring by <a href="https://upptime.js.org">Upptime</a> (MIT)</span>
          </p>
        </div>
        <nav class="pb-footer__nav" aria-label="Footer navigation">
          <a href="https://pteridobase.org/credits/">Credits</a>
        </nav>
      </div>
    </footer>

  css: |
    /* ---- Brand faces, self-hosted (see the note above on why) ------------- */
    @font-face {
      font-family: 'Merriweather Sans'; font-style: normal; font-weight: 300;
      font-display: swap; src: url('/fonts/merriweather-sans-300-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Merriweather Sans'; font-style: normal; font-weight: 400;
      font-display: swap; src: url('/fonts/merriweather-sans-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Merriweather Sans'; font-style: normal; font-weight: 700;
      font-display: swap; src: url('/fonts/merriweather-sans-700-normal.woff2') format('woff2');
    }

    /* The EFG palette, reproduced exactly from the brand kit. Same token names
       as theme/pteridobase/assets/css/homepage.css so the two read alike. */
    :root {
      --efg-verdun-green: #336600;
      --efg-camouflage:   #33340e;
      --pb-orange:        #d8613c;
      --pb-font-sans:  'Merriweather Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --pb-font-serif: Georgia, 'Times New Roman', Times, serif;
    }

    /* Upptime ships its own bare <nav> and <footer>. Ours replace them.
       Matched with :not() rather than a child selector so this keeps working if
       the generator changes where they sit in the tree.
       BOTH of our navs must be excluded. The footer's link list is also a <nav>,
       so the first version of this rule - which only spared .pb-nav-links - hid
       the entire footer navigation. Every DOM check still passed, because the
       six links existed and carried the right text; they were simply zero-sized.
       Only a screenshot showed it. */
    nav:not(.pb-nav-links):not(.pb-footer__nav),
    footer:not(.pb-footer) { display: none !important; }

    /* Upptime styles the bare `nav` element with a white background, which both
       of ours inherited - painting a white block over the Camouflage navbar and
       the green footer. Reset it explicitly rather than relying on our own rules
       to happen to override a selector we do not control. */
    /* Upptime styles the bare `nav` element with a white background AND a
       1px bottom border, both of which ours inherited: a white block over the
       Camouflage navbar, and a rule that reads as a stray underline - drawn
       across the whole CONTAINER, which is why it ran well past the last link.
       Measured, not guessed: every <a> reports text-decoration: none, so the
       line was never an underline at all. Reset explicitly rather than trusting
       our own rules to beat a selector we do not control. */
    .pb-nav-links, .pb-footer__nav { background: transparent; border: 0; }

    body {
      font-family: var(--pb-font-serif);
      background: #ffffff;
      margin: 0;
    }
    /* Both injected blocks arrive at the top of #sapper, so ORDER - not DOM
       position - puts the footer last. flex:1 on main also pins the footer to
       the bottom of short pages instead of leaving it floating mid-screen. */
    #sapper { display: flex; flex-direction: column; min-height: 100vh; }
    .pb-navbar { order: 0; }
    .pb-footer { order: 2; }

    /* WIDTH. Upptime caps content at 800px; the site's own standing pages
       (stubs.css) use 1100px, so this matches /help/ rather than Upptime.
       `width: 100%` is load-bearing and not redundant: <main> carries
       `margin: 0 auto`, and an auto cross-axis margin DISABLES flex stretch, so
       inside the flex column above it collapsed to its content width - 379px in
       a 1440px viewport - and centred itself. It read as a styling choice rather
       than a bug, which is why it needed measuring rather than looking at.
       Addressed via #sapper > main so it beats Upptime's `.container` on
       specificity without !important. */
    #sapper > main {
      order: 1;
      flex: 1 0 auto;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      box-sizing: border-box;
      /* The title sat flush against the navbar - measured gap 0px, because the
         navbar is sticky and <main> had no top padding. */
      padding: 32px 20px 48px;
    }
    h1, h2, h3, h4 { font-family: var(--pb-font-sans); font-weight: 700; }
    main a { color: var(--efg-verdun-green); }

    /* ---- Navbar ----------------------------------------------------------- */
    /* SOLID Camouflage, not the homepage's translucent black: that treatment
       only reads correctly over the hero photograph, and over a white page it
       looks like flat grey. This is the same choice
       `body.pb-search-page .pb-navbar` makes on the site itself.
       sticky rather than the site's `fixed`, because fixed needs a matching
       body padding-top that the site computes in JS and this page has none. */
    .pb-navbar {
      background: var(--efg-camouflage);
      color: #ffffff;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .pb-logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    /* A background-image, not an <img>: Sapper crawls HTML src/href and would
       export this path as a 404 ROUTE, creating a directory that then collides
       with the real file. CSS url() is not crawled - the fonts below prove it,
       they survived the build that this broke. */
    .pb-logo-img {
      width: 38px; height: 38px; flex-shrink: 0; display: block;
      background: url('/efg-logomark-white.svg') no-repeat center / contain;
    }
    .pb-logo-textblock { display: flex; flex-direction: column; line-height: 1.2; }
    .pb-logo-text { font-family: var(--pb-font-sans); font-weight: 700; font-size: 13px; color: #ffffff; }
    .pb-logo-sub  { display: none; font-family: var(--pb-font-sans); font-size: 9px; font-weight: 300; color: rgba(255,255,255,0.75); }
    /* 11px / 18px gap, MEASURED off pteridobase.org/help/ rather than copied from
       the stylesheet: homepage.css's `.pb-nav-links { font-size: 14px }` is the
       MOBILE dropdown-panel rule, and a tablet+ media query overrides it to 11px
       for the horizontal bar. Reading the first matching rule gave the wrong
       number; the rendered page gave the right one. */
    .pb-nav-links { display: flex; flex-direction: row; gap: 18px; font-family: var(--pb-font-sans); font-size: 11px; }
    .pb-nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; }
    .pb-nav-links a:hover, .pb-nav-links a:focus { color: #ffffff; text-decoration: underline; }

    /* ---- Footer ----------------------------------------------------------- */
    .pb-footer { background: var(--efg-verdun-green); color: #fff; }
    .pb-footer__inner {
      padding: 14px 20px; display: flex; flex-direction: column-reverse;
      gap: 10px; align-items: flex-start;
    }
    .pb-footer__brand { display: flex; flex-direction: column; gap: 2px; }
    .pb-footer__brand-link { font-family: var(--pb-font-sans); font-weight: 400; font-size: 13px; color: #fff; text-decoration: none; }
    .pb-footer__brand-link strong { font-weight: 700; }
    /* The disappearing-middot row, carried over from the site (#805). Each
       segment is a flex item; the separator is an absolutely-positioned
       ::before pinned to the segment's left edge, so it sits inside the column
       gap and is CLIPPED when a segment starts a new line.
       0.75 alpha is a FLOOR, not a default: white on #336600 measures 4.68:1
       there and 4.29:1 at 0.70, so anything quieter drops a statutory
       disclosure below WCAG AA. min-width:0 is load-bearing WITH the clipping,
       or a long segment would overflow and the disclosure would be cut off. */
    .pb-footer__legalrow {
      display: flex; flex-wrap: wrap; gap: 2px 0.85em; overflow: hidden; margin: 0;
      font-family: var(--pb-font-sans); font-size: 11px; color: rgba(255,255,255,0.75);
    }
    .pb-footer__legalrow > span { position: relative; min-width: 0; }
    .pb-footer__legalrow > span + span::before {
      content: "\00B7"; position: absolute; right: 100%; width: 0.85em;
      text-align: center; color: inherit;
    }
    .pb-footer__legalrow a { color: inherit; text-decoration: underline; }
    .pb-footer__nav { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px 20px; }
    .pb-footer__nav a { font-family: var(--pb-font-sans); font-size: 13px; color: #fff; text-decoration: none; }
    .pb-footer__nav a:hover, .pb-footer__nav a:focus { text-decoration: underline; }

    @media (min-width: 768px) {
      .pb-logo-sub { display: block; }
      .pb-footer__inner { padding: 14px 32px; flex-direction: row; justify-content: space-between; align-items: center; gap: 32px; }
      #sapper > main { padding: 40px 32px 48px; }
    }
    @media (min-width: 1024px) {
      .pb-footer__inner { padding: 14px 48px; }
      #sapper > main { padding: 40px 48px 48px; }
    }

  navbar:
    # The key is `href`. Verified from two independent sources rather than
    # recalled: the upstream template ships `href`, and the renderer
    # (status-page/src/components/Nav.svelte) reads `item.href`. An earlier
    # draft of this file used `url` and carried a comment asserting `href` was
    # the broken form — which would have produced a navbar whose links all go
    # nowhere, with a comment telling the next reader it was already fixed.
    - title: Status
      href: /
    - title: Pteridobase
      href: https://pteridobase.org
    - title: Exotic Fern Group
      href: https://www.exoticferngroup.org

assignees:
  - Knavesdied

# NOTIFICATIONS — deliberately NOT configured here, because they cannot be.
#
# Upptime reads every notification setting from GITHUB ACTIONS SECRETS, not from
# this file: uptime.yml passes them through as a SECRETS_CONTEXT blob. There is
# no `notifications:` key in this config, and writing one has no effect — it
# would sit here looking configured while nothing sends. Verified by reading
# .github/workflows/uptime.yml rather than from the documentation.
#
# The credential is the owner's to create and never Claude's to handle. The
# intended channel is SMTP via Resend, already a Pteridobase sub-processor for
# transactional mail, so it adds no new company to the privacy posture.
#
# Set these as repository secrets (Settings -> Secrets and variables -> Actions):
#
#   NOTIFICATION_EMAIL             true
#   NOTIFICATION_EMAIL_STRATEGY    smtp
#   NOTIFICATION_EMAIL_SMTP_HOST   smtp.resend.com
#   NOTIFICATION_EMAIL_SMTP_PORT   587
#   NOTIFICATION_EMAIL_SMTP_USERNAME  resend
#   NOTIFICATION_EMAIL_SMTP_PASSWORD  <the Resend API key>
#   NOTIFICATION_EMAIL_FROM        Pteridobase Status <status@pteridobase.org>
#   NOTIFICATION_EMAIL_TO          <where the alert should land>
